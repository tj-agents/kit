name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    uses: ./.github/workflows/plugin-ci.yml
    with:
      kit_ref: ${{ github.sha }}
    secrets:
      read_token: ${{ secrets.TJ_AGENTS_READ_TOKEN }}

  regenerate:
    if: github.event_name == 'push'
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: regenerate-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: regenerate committed packages from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify the regenerated tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: commit and push the regeneration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .codex/skills .claude/skills .agents/INDEX.md .agents/plugins/marketplace.json .claude-plugin/marketplace.json plugins
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "Regenerate packages for $env:GITHUB_SHA"
            git push origin HEAD:main
          } else {
            "Generated output already current."
          }
